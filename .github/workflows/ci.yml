# Проверки на каждый push и PR: типы, контент, сборка, продовый nginx, e2e, скриншоты.
# Деплой делает Dokploy по push в main независимо от CI - смотри статус до мержа.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_BUILD_DATE: "2026-09-27"

# Раннеры свои: ci-visitka-1/2 в изолированной VM ci на домашнем сервере serverlink (с 20.10.2026).
# PR из форков идут на ubuntu-latest (для публичного репозитория бесплатно), чтобы чужой код не
# исполнялся на своих машинах; запуск для внешних участников требует одобрения в настройках репо.
# Два прогона могут идти на одной VM одновременно: e2e и скриншоты — в контейнере Playwright со
# своей сетью, а джобы с Docker на фиксированных портах (nginx 8088, производительность 8089)
# выстроены в общую очередь visitka-host-docker.

jobs:
  checks:
    name: Типы, контент, сборка, nginx
    concurrency:
      group: visitka-host-docker
      cancel-in-progress: false
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы (astro check)
        run: npm run check
      - name: Контент, i18n, llms.txt
        run: npm run test:unit
      - name: Сборка с фиксированной датой
        run: npm run build:test
      - name: Готовая сборка - SEO, JSON-LD, ссылки, sitemap
        run: npm run test:dist
      - name: Продовый Docker-образ - коды, заголовки, кэш, gzip
        run: npm run test:nginx
        env:
          NGINX_MODE: image

  e2e:
    name: E2E и доступность
    # Браузер и системные библиотеки уже в образе той же версии, что @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Скриншоты
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 20
    # Версия образа = версия @playwright/test (проверяет tests/unit/tooling.test.ts)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:test
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  performance:
    name: SEO и скорость продового образа
    concurrency:
      group: visitka-host-docker
      cancel-in-progress: false
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Собрать и запустить статический продовый образ
        run: |
          docker build -t nadt-performance .
          # На своём раннере контейнер прошлого (отменённого) прогона мог остаться.
          docker rm -f nadt-performance >/dev/null 2>&1 || true
          docker run -d --name nadt-performance -p 8089:80 nadt-performance
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8089/; then break; fi
            sleep 1
          done
      - run: npm run check:seo
      - name: Lighthouse — все страницы и оба класса устройств
        run: CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")" npm run check:performance -- --all-pages
      - name: Убрать контейнер производительности
        if: always()
        run: docker rm -f nadt-performance >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: test-results/
          retention-days: 14
