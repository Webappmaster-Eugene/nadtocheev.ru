server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Относительные редиректы (/en -> /en/): за Traefik с TLS абсолютный редирект
    # собирался бы как http://host:80/en/ и уводил с HTTPS
    absolute_redirect off;

    # Кастомная страница 404 (src/pages/404.astro)
    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Хешированные ассеты Astro - кешируем навсегда
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Шрифты - имена без хеша, поэтому без immutable
    location ^~ /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Скрытые файлы запрещены. /.well-known/ открыт: ^~-локация ниже приоритетнее regex.
    # Regex-локации проверяются по порядку, поэтому эта стоит перед статикой
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Прочая статика без хеша в имени (og-image, фавиконки, манифест) - короткий кеш,
    # чтобы замена файла доходила до пользователей
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|webmanifest|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files $uri =404;
    }

    # Сама страница 404 доступна только через error_page;
    # /404 без расширения тоже должен отдавать код 404, а не 200
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
    location = /404 {
        return 404;
    }

    # Allow .well-known for security.txt and other standards
    location ^~ /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML и txt - всегда ревалидируем, чтобы деплой был виден сразу
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
